<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>智慧树助手</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="float-window">
  <div class="wrap">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span class="title">智慧树助手</span>
      <span class="spacer"></span>
      <span class="idx" id="idx">— / —</span>
      <button id="btn-theme" title="切换明暗">◐</button>
      <button id="btn-settings" title="设置">⚙</button>
      <button id="btn-min" title="最小化到托盘">—</button>
      <button id="btn-close" title="收进托盘">✕</button>
    </div>

    <div class="status">
      <span id="status">就绪</span>
      <span class="bank" id="bank">题库 0</span>
    </div>

    <!-- 步骤面板：截屏 → 提取（千问）→ 输出（DeepSeek），逐步点亮 -->
    <div class="steps" id="steps"></div>

    <div class="body" id="body">
      <div class="empty">
        还没有识别到题目。<br />
        用你自己的浏览器打开智慧树作业页，<br />
        然后点下面的 <b>「开始识题」</b>。
      </div>
    </div>

    <div class="foot">
      <button id="btn-prev">← 上一题</button>
      <button id="btn-next">下一题 →</button>
    </div>
    <div class="foot">
      <button id="btn-toggle" class="primary">开始识题</button>
      <button id="btn-once">截屏一次</button>
    </div>
  </div>

  <script src="./shim.js"></script>
  <script type="module" src="./float.js"></script>
</body>
</html>
